body{

  <div class="record-header">

<script>
"use strict";
const API = "https://api-contract.weex.com/capi/v3";
const SYMBOLS = [ {id:"BTCUSDT",name:"BTC"}, {id:"ETHUSDT",name:"ETH"}, {id:"SOLUSDT",name:"SOL"}, {id:"ZECUSDT",name:"ZEC"}, {id:"XAUTUSDT",name:"XAUT"}, {id:"SNDKUSDT",name:"SNDK"}];
const LIMIT = 300;
const QUOTE_STALE_MS = 40000;
const tickerCache = Object.create(null);
const EMA_FAST = 50;
const EMA_SLOW = 200;
const VOL_MULT = 1.35;
const MIN_SCORE = 2;
const MIN_RR = 2;
const SL_BUFFER = 0.003;
const SAME_POS_THRESHOLD = 0.008;
let autoRefresh = true;
let timer = null;
let busy = false;
let soundEnable = true;
let lastSignalKey = new Set();
let recordPool = [];
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep(){
    if(!soundEnable) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = 880;
    osc.type = "sine";
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.22);
}
function toggleSound(){
    soundEnable = !soundEnable;
    document.getElementById("soundText").textContent = soundEnable ? "开" : "关";
}
function clearRecordPool(){
    recordPool = [];
    renderRecordPool();
}
function renderRecordPool(){
    const wrap = document.getElementById("recordPool");
    if(recordPool.length === 0){
        wrap.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:6px">暂无存入的有效多/空信号</div>`;
        return;
    }
    let html = "";
    for(const item of recordPool){
        html += `
        <div class="record-item ${item.side==='LONG'?'long':'short'}">
            <div class="record-time">信号时间：${item.timeStr}</div>
            <div style="font-weight:bold;margin-bottom:4px">${item.name} ${item.side==='LONG'?'✅做多':'❌做空'}</div>
            <div class="meta">
                <div class="meta-item"><div class="label">入场区间</div><div class="value">${item.entryText}</div></div>
                <div class="meta-item"><div class="label">止损SL</div><div class="value red">${item.stopText}</div></div>
                <div class="meta-item"><div class="label">TP1 1.2R</div><div class="value green">${item.tp1Text}</div></div>
                <div class="meta-item"><div class="label">TP2 1.8R</div><div class="value green">${item.tp2Text}</div></div>
                <div class="meta-item"><div class="label">TP3 2.5R</div><div class="value green">${item.tp3Text}</div></div>
                <div class="meta-item"><div class="label">评分</div><div class="value">${item.score.toFixed(1)}</div></div>
            </div>
            <div class="reason" style="margin-top:6px">触发理由：${item.reasons}</div>
        </div>
        `
    }
    wrap.innerHTML = html;
}
function isNearLastRecord(symbolId, newStop, newEntryMid){
    const sameSym = recordPool.filter(r=>r.symbolId === symbolId);
    if(sameSym.length === 0) return false;
    const last = sameSym[sameSym.length-1];
    const stopDiff = Math.abs(newStop - last.stopVal) / last.stopVal;
    const entryDiff = Math.abs(newEntryMid - last.entryMidVal) / last.entryMidVal;
    if(stopDiff < SAME_POS_THRESHOLD && entryDiff < SAME_POS_THRESHOLD){
        return true;
    }
    return false;
}
function addRecordIfNeed(d){
    if(d.side !== "LONG" && d.side !== "SHORT") return false;
    if(!d.stop || !d.entry) return false;
    const entryMid = (d.entry[0] + d.entry[1]) / 2;
    if(isNearLastRecord(d.symbolId, d.stop, entryMid)){
        return false;
    }
    const now = new Date();
    const rec = {
        symbolId:d.symbolId,
        name:d.name,
        side:d.side,
        timeStr:now.toLocaleString("zh-CN",{hour12:false}),
        entryMidVal:entryMid,
        stopVal:d.stop,
        entryText:`${formatPrice(d.entry[0])} ~ ${formatPrice(d.entry[1])}`,
        stopText:formatPrice(d.stop),
        tp1Text:formatPrice(d.tp1),
        tp2Text:formatPrice(d.tp2),
        tp3Text:formatPrice(d.tp3),
        score:d.score,
        reasons:d.reasons
    }
    recordPool.push(rec);
    renderRecordPool();
    return true;
}
function ema(data,period){
 if(data.length < period) return null;
 const k = 2/(period+1);
 let value = data.slice(0,period).reduce((a,b)=>a+b,0)/period;
 for(let i=period;i<data.length;i++){
 value=data[i]*k+value*(1-k);
 }
 return value;
}
function sma(data,period){
 if(data.length<period)return null;
 return data.slice(-period).reduce((a,b)=>a+b,0)/period;
}
function rsi(data,period=14){
 if(data.length<period+1)return null;
 let gains=0,losses=0;
 for(let i=data.length-period;i<data.length;i++){
 const d=data[i]-data[i-1];
 if(d>0)gains+=d;
 else losses-=d;
 }
 const avgGain=gains/period;
 const avgLoss=losses/period;
 if(avgLoss===0)return 100;
 return 100-(100/(1+avgGain/avgLoss));
}
function atr(k,period=14){
 if(k.closes.length<period+1)return null;
 const values=[];
 for(let i=1;i<k.closes.length;i++){
 values.push(Math.max(
 k.highs[i]-k.lows[i],
 Math.abs(k.highs[i]-k.closes[i-1]),
 Math.abs(k.lows[i]-k.closes[i-1])
 ));
 }
 return sma(values,period);
}
function findPivotLows(values,left=3,right=2){
 const result=[];
 for(let i=left;i<values.length-right;i++){
 let ok=true;
 for(let j=1;j<=left;j++)if(values[i]>=values[i-j])ok=false;
 for(let j=1;j<=right;j++)if(values[i]>=values[i+j])ok=false;
 if(ok)result.push({index:i,value:values[i]});
 }
 return result;
}
function findPivotHighs(values,left=3,right=2){
 const result=[];
 for(let i=left;i<values.length-right;i++){
 let ok=true;
 for(let j=1;j<=left;j++)if(values[i]<=values[i-j])ok=false;
 for(let j=1;j<=right;j++)if(values[i]<=values[i+j])ok=false;
 if(ok)result.push({index:i,value:values[i]});
 }
 return result;
}
function normalizeTicker(raw, receivedAt=Date.now()){
 if(!raw)return null;
 const lastPrice=Number(raw.lastPrice ?? raw.c ?? raw.last ?? raw.price);
 const markPrice=Number(raw.markPrice ?? raw.m);
 const indexPrice=Number(raw.indexPrice ?? raw.i);
 const changePct=Number(raw.priceChangePercent ?? raw.P);
 const eventTime=Number(raw.eventTime ?? raw.E ?? raw.closeTime ?? raw.timestamp ?? raw.receivedAt);
 if(!Number.isFinite(lastPrice)||lastPrice<=0)return null;
 return {lastPrice,markPrice:Number.isFinite(markPrice)&&markPrice>0?markPrice:null,
 indexPrice:Number.isFinite(indexPrice)&&indexPrice>0?indexPrice:null,
 changePct:Number.isFinite(changePct)?changePct:null,
 eventTime:Number.isFinite(eventTime)&&eventTime>0?eventTime:receivedAt,receivedAt};
}
async function refreshTickerSnapshot(){
 const response=await fetch(API+"/market/ticker/24hr",{method:"GET",headers:{"Accept":"application/json"},cache:"no-store",signal:AbortSignal.timeout(10000)});
 if(!response.ok)throw new Error("WEEX行情HTTP "+response.status);
 const raw=await response.json();
 const rows=Array.isArray(raw)?raw:(Array.isArray(raw.data)?raw.data:[raw]);
 const receivedAt=Date.now();let count=0;
 for(const row of rows){
 const symbol=String(row.symbol||"").toUpperCase();
 if(!SYMBOLS.some(x=>x.id===symbol))continue;
 const q=normalizeTicker(row,receivedAt);
 if(q){tickerCache[symbol]=q;count++;}
 }
 if(count===0)throw new Error("未读取到对应币种ticker");
 return count;
}
async function fetchKlines(symbol,interval){
 const url = API+"/market/klines?symbol="+encodeURIComponent(symbol)+"&interval="+encodeURIComponent(interval)+"&limit="+LIMIT;
 const controller = new AbortController();
 const timeout = setTimeout(()=>controller.abort(),10000);
 try{
 const response=await fetch(url,{method:"GET",headers:{"Accept":"application/json"},signal:controller.signal,cache:"no-store"});
 if(!response.ok){throw new Error("K线接口 "+response.status);}
 const raw=await response.json();
 if(!Array.isArray(raw)||raw.length<30){throw new Error("K线数量不足");}
 const now=Date.now();
 const closed=raw.filter(k=>Array.isArray(k)&&Number(k[6])>0&&Number(k[6])<now);
 if(closed.length<30){throw new Error("有效收盘K线太少");}
 closed.sort((a,b)=>Number(a[0])-Number(b[0])); return parseKlines(closed);
 }finally{clearTimeout(timeout);}
}
function parseKlines(raw){
 const result={times:[],opens:[],highs:[],lows:[],closes:[],volumes:[]};
 raw.forEach(k=>{
 result.times.push(Number(k[0]));
 result.opens.push(Number(k[1]));
 result.highs.push(Number(k[2]));
 result.lows.push(Number(k[3]));
 result.closes.push(Number(k[4]));
 result.volumes.push(Number(k[5]));
 });
 return result;
}
function getTrend(k){
 const c=k.closes;
 const fast=ema(c,EMA_FAST);
 const slow=ema(c,EMA_SLOW);
 const price=c[c.length-1];
 if(fast===null)return "NEUTRAL";
 if(slow!==null){
 if(price>fast&&fast>slow)return "BULL";
 if(price<fast&&fast<slow)return "BEAR";
 }else{
 if(price>fast)return "BULL";
 if(price<fast)return "BEAR";
 }
 return "NEUTRAL";
}
function getStructure(k){
 const c=k.closes;
 const h=k.highs;
 const l=k.lows;
 const price=c[c.length-1];
 const lookback=20;
 const previousHigh=Math.max(...h.slice(-lookback-1,-1));
 const previousLow=Math.min(...l.slice(-lookback-1,-1));
 const breakUp=price>previousHigh;
 const breakDown=price<previousLow;
 const nearHigh=price>=previousHigh*0.985;
 const nearLow=price<=previousLow*1.015;
 const recentHighs=findPivotHighs(h);
 const recentLows=findPivotLows(l);
 const lastHigh=recentHighs.length?recentHighs[recentHighs.length-1]:null;
 const lastLow=recentLows.length?recentLows[recentLows.length-1]:null;
 const previousHighPivot=recentHighs.length>1?recentHighs[recentHighs.length-2]:null;
 const previousLowPivot=recentLows.length>1?recentLows[recentLows.length-2]:null;
 const atrValue=atr(k)||price*0.005;
 return {previousHigh,previousLow,breakUp,breakDown,nearHigh,nearLow,lastHigh,lastLow,previousHighPivot,previousLowPivot,atrValue};
}
function detectDivergence(k){
 const prices=k.closes;
 const values=[];
 for(let i=0;i<prices.length;i++){
 values.push(rsi(prices.slice(0,i+1),14));
 }
 const valid=[];
 for(let i=0;i<values.length;i++){
 if(values[i]!==null)valid.push({index:i,value:values[i]});
 }
 if(valid.length<10)return {bull:false,bear:false};
 const rsiValues=values.map(v=>v===null?50:v);
 const lows=findPivotLows(k.lows);
 const highs=findPivotHighs(k.highs);
 let bull=false,bear=false;
 if(lows.length>=2){
 const a=lows[lows.length-2];
 const b=lows[lows.length-1];
 if(b.index-a.index>=3){
 bull=k.lows[b.index]<k.lows[a.index]&&rsiValues[b.index]>rsiValues[a.index]+2;
 }
 }
 if(highs.length>=2){
 const a=highs[highs.length-2];
 const b=highs[highs.length-1];
 if(b.index-a.index>=3){
 bear=k.highs[b.index]>k.highs[a.index]&&rsiValues[b.index]<rsiValues[a.index]-2;
 }
 }
 return {bull,bear};
}
function analyze(info,k4h,k1h,k15,k5,ticker){
 const analysisPrice=k5.closes[k5.closes.length-1];
 const price=ticker.lastPrice;
 const changePct=ticker.changePct===null?0:ticker.changePct;
 const trend4=getTrend(k4h);
 const trend1=getTrend(k1h);
 const trend15=getTrend(k15);
 const structure15=getStructure(k15);
 const structure5=getStructure(k5);
 const volAvg=sma(k5.volumes.slice(0,-1),20);
 const volNow=k5.volumes[k5.volumes.length-1];
 const volOk=volAvg!==null&&volNow>volAvg*VOL_MULT;
 const rsiValue=rsi(k5.closes);
 const div=detectDivergence(k5);
 const ema50_5=ema(k5.closes,EMA_FAST);
 const candleOpen=k5.opens[k5.opens.length-1];
 const candleClose=analysisPrice;
 const candleHigh=k5.highs[k5.highs.length-1];
 const candleLow=k5.lows[k5.lows.length-1];
 const bullishCandle=candleClose>candleOpen;
 const bearishCandle=candleClose<candleOpen;
 const nearEma=ema50_5!==null&&Math.abs(analysisPrice-ema50_5)/analysisPrice<0.008;
 const longBreak=structure15.breakUp;
 const shortBreak=structure15.breakDown;
 const longPullback=!longBreak&&structure15.nearHigh&&bullishCandle&&(nearEma||structure5.lastLow&&analysisPrice>structure5.lastLow.value);
 const shortPullback=!shortBreak&&structure15.nearLow&&bearishCandle&&(nearEma||structure5.lastHigh&&analysisPrice<structure5.lastHigh.value);
 const longConfirm=bullishCandle&&(longBreak||longPullback)&&analysisPrice>candleLow;
 const shortConfirm=bearishCandle&&(shortBreak||shortPullback)&&analysisPrice<candleHigh;
 let longScore=0;
 let shortScore=0;
 const longReasons=[];
 const shortReasons=[];
 if(trend4==="BULL"){longScore+=0.5;longReasons.push("4H趋势偏多");}
 if(trend4==="BEAR"){shortScore+=0.5;shortReasons.push("4H趋势偏空");}
 if(trend1==="BULL"){longScore+=0.5;longReasons.push("1H方向偏多");}
 if(trend1==="BEAR"){shortScore+=0.5;shortReasons.push("1H方向偏空");}
 if(trend15==="BULL"){longScore+=0.5;longReasons.push("15M结构偏多");}
 if(trend15==="BEAR"){shortScore+=0.5;shortReasons.push("15M结构偏空");}
 if(longBreak){longScore+=1;longReasons.push("15M向上突破");}
 if(shortBreak){shortScore+=1;shortReasons.push("15M向下突破");}
 if(longPullback){longScore+=1;longReasons.push("突破/回踩承接");}
 if(shortPullback){shortScore+=1;shortReasons.push("跌破/反抽承压");}
 if(volOk){
 if(bullishCandle){longScore+=0.5;longReasons.push("5M放量阳线");}
 if(bearishCandle){shortScore+=0.5;shortReasons.push("5M放量阴线");}
 }
 if(nearEma){
 if(bullishCandle)longScore+=0.5;
 if(bearishCandle)shortScore+=0.5;
 }
 if(div.bull){longScore+=0.5;longReasons.push("RSI底背离");}
 if(div.bear){shortScore+=0.5;shortReasons.push("RSI顶背离");}
 if(rsiValue!==null&&rsiValue>78)longScore-=0.5;
 if(rsiValue!==null&&rsiValue<22)shortScore-=0.5;
 if(trend4==="BEAR")longScore-=1;
 if(trend4==="BULL")shortScore-=1;
 longScore=Math.max(0,longScore);
 shortScore=Math.max(0,shortScore);
 let side="NONE";
 let type="观望";
 let score=0;
 let reasons=[];
 let entry=null,stop=null,tp1=null,tp2=null,tp3=null,rr=null;
 let invalid="当前没有明确的有效入场条件";
 const signalTime=Date.now();
 const longReady=longScore>=MIN_SCORE&&longScore>shortScore;
 const shortReady=shortScore>=MIN_SCORE&&shortScore>longScore;
 if(longReady){
 side="LONG";
 score=longScore;
 reasons=longReasons;
 if(longConfirm){type=longBreak?"确认做多 · 突破":"确认做多 · 回踩";}
 else if(longPullback){type="回踩埋伏 · 做多";}else{type="提前预警 · 偏多";}
 const pivot=structure5.lastLow?structure5.lastLow.value:structure15.previousLow;
 stop=Math.min(pivot,structure15.previousLow)-structure5.atrValue*0.15;
 stop=stop*(1-SL_BUFFER);
 if(stop>=price)stop=price-structure5.atrValue;
 const risk=price-stop;
 entry=[price-structure5.atrValue*0.25,price+structure5.atrValue*0.1];
 tp1=price+risk*1.2;tp2=price+risk*1.8;tp3=price+risk*2.5;
 rr=(tp1-price)/risk;
 invalid="5M收盘跌破止损位，或15M结构转为空头";
 }else if(shortReady){
 side="SHORT";
 score=shortScore;
 reasons=shortReasons;
 if(shortConfirm){type=shortBreak?"确认做空 · 跌破":"确认做空 · 反抽";}
 else if(shortPullback){type="反抽埋伏 · 做空";}else{type="提前预警 · 偏空";}
 const pivot=structure5.lastHigh?structure5.lastHigh.value:structure15.previousHigh;
 stop=Math.max(pivot,structure15.previousHigh)+structure5.atrValue*0.15;
 stop=stop*(1+SL_BUFFER);
 if(stop<=price)stop=price+structure5.atrValue;
 const risk=stop-price;
 entry=[price-structure5.atrValue*0.1,price+structure5.atrValue*0.25];
 tp1=price-risk*1.2;tp2=price-risk*1.8;tp3=price-risk*2.5;
 rr=(price-tp1)/risk;
 invalid="5M收盘突破止损位，或15M结构转为多头";
 }else if(longScore>shortScore&&longScore>=1){
 side="WATCH";score=longScore;type="观察 · 等待做多确认";reasons=longReasons;
 }else if(shortScore>longScore&&shortScore>=1){
 side="WATCH";score=shortScore;type="观察 · 等待做空确认";reasons=shortReasons;
 }
 if(side==="LONG"||side==="SHORT"){
 const riskDistance=Math.abs(price-stop);
 const riskPct=riskDistance/price;
 if(!Number.isFinite(riskPct)||riskPct>0.05||riskPct<0.0005){
 side="WATCH";type="风险距离异常 · 暂不入场";entry=stop=tp1=tp2=tp3=rr=null;
 invalid="等待更合理的结构止损位置";
 }
 }
 return {name:info.name,symbolId:info.id,price,changePct,ticker,side,type,score,reasons:reasons.join(" · ")||"暂无明确信号",trend4,trend1,trend15,volOk,rsiValue,div,entry,stop,tp1,tp2,tp3,rr,invalid,longScore,shortScore,signalTime};
}
function formatPrice(value){
 if(value===null||!Number.isFinite(value))return "--";
 if(value>=1000)return value.toFixed(2);
 if(value>=100)return value.toFixed(3);
 if(value>=1)return value.toFixed(4);
 return value.toFixed(6);
}
function formatTime(ts){
 if(!Number.isFinite(ts))return "--";
 return new Date(ts).toLocaleString("zh-CN",{hour12:false});
}
function renderCard(d){
 let badge="none",badgeText="观望",cardClass="";
 if(d.side==="LONG"){badge="long";badgeText=d.type;cardClass="long";}
 else if(d.side==="SHORT"){badge="short";badgeText=d.type;cardClass="short";}
 else if(d.side==="WATCH"){badge="watch";badgeText=d.type;}
 const changeClass=d.changePct>=0?"up":"down";
 const change=(d.changePct>=0?"+":"")+d.changePct.toFixed(2)+"%";
 let plan="";
 if(d.entry&&d.stop!==null){
 plan=`
 <div class="plan">
 <div class="plan-title">交易计划参考</div>
 <div class="meta">
 <div class="meta-item"><div class="label">参考入场区</div><div class="value">${formatPrice(d.entry[0])} - ${formatPrice(d.entry[1])}</div></div>
 <div class="meta-item"><div class="label">止损 SL</div><div class="value red">${formatPrice(d.stop)}</div></div>
 <div class="meta-item"><div class="label">止盈 TP1 · 1.2R</div><div class="value green">${formatPrice(d.tp1)}</div></div>
 <div class="meta-item"><div class="label">止盈 TP2 · 1.8R</div><div class="value green">${formatPrice(d.tp2)}</div></div>
 <div class="meta-item"><div class="label">止盈 TP3 · 2.5R</div><div class="value green">${formatPrice(d.tp3)}</div></div>
 <div class="meta-item"><div class="label">盈亏比参考</div><div class="value">${d.rr.toFixed(2)} : 1</div></div>
 <div class="meta-item" style="grid-column:1/-1"><div class="label">信号生成时间（止盈止损参考触发时间）</div><div class="value yellow">${formatTime(d.signalTime)}</div></div>
 </div>
 <div class="plan-note">失效条件：${d.invalid}</div>
 </div>`;
 }
 return `
 <div class="card ${cardClass}">
 <div class="card-header">
 <div>
 <div class="symbol">${d.name}/USDT</div>
 <div><span class="price">${d.price>0?formatPrice(d.price):"--"}</span><span class="change ${changeClass}">${d.price>0?change:"--"}</span></div> <div class="ticker-line">报价更新 · ${d.ticker?new Date(d.ticker.receivedAt).toLocaleTimeString("zh-CN",{hour12:false}):"--"}</div> <div class="ticker-line">标记价 <strong>${d.ticker&&d.ticker.markPrice!==null?formatPrice(d.ticker.markPrice):"--"}</strong>　指数价 <strong>${d.ticker&&d.ticker.indexPrice!==null?formatPrice(d.ticker.indexPrice):"--"}</strong></div>
 </div>
 <div class="badge ${badge}">${badgeText}</div>
 </div>
 <div class="reason">${d.reasons}</div>
 <div class="score">策略评分：${d.score.toFixed(1)}/5　多头 ${d.longScore.toFixed(1)} 分 / 空头 ${d.shortScore.toFixed(1)} 分</div>
 <div class="meta">
 <div class="meta-item"><div class="label">4H大趋势</div><div class="value">${trendText(d.trend4)}</div></div>
 <div class="meta-item"><div class="label">1H方向</div><div class="value">${trendText(d.trend1)}</div></div>
 <div class="meta-item"><div class="label">15M结构</div><div class="value">${trendText(d.trend15)}</div></div>
 <div class="meta-item"><div class="label">5M成交量</div><div class="value">${d.volOk?"放量":"未放量"}</div></div>
 <div class="meta-item"><div class="label">5M RSI</div><div class="value">${d.rsiValue===null?"--":d.rsiValue.toFixed(1)}</div></div>
 <div class="meta-item"><div class="label">背离检测</div><div class="value">${d.div.bull?"底背离":d.div.bear?"顶背离":"无明显背离"}</div></div>
 </div>
 ${plan}
 <div class="tags">
 <span class="tag ${d.trend4==="BULL"?"on":d.trend4==="BEAR"?"off":""}">4H趋势</span>
 <span class="tag ${d.trend1==="BULL"?"on":d.trend1==="BEAR"?"off":""}">1H方向</span>
 <span class="tag ${d.volOk?"on":""}">成交量过滤</span>
 <span class="tag ${d.div.bull?"on":d.div.bear?"off":""}">RSI背离</span>
 </div>
 </div>`;
}
function trendText(value){
 if(value==="BULL")return '<span class="green">偏多</span>';
 if(value==="BEAR")return '<span class="red">偏空</span>';
 return "中性";
}
function setStatus(type,text){
 document.getElementById("statusDot").className="dot "+type;
 document.getElementById("statusText").textContent=text;
}
async function loadOne(symbol){
 const ticker=tickerCache[symbol.id];
 if(!ticker)throw new Error(symbol.id+" 暂无报价");
 const [k4h,k1h,k15,k5]=await Promise.all([
 fetchKlines(symbol.id,"4h"),fetchKlines(symbol.id,"1h"),
 fetchKlines(symbol.id,"15m"),fetchKlines(symbol.id,"5m")
 ]);
 return analyze(symbol,k4h,k1h,k15,k5,ticker);
}
async function loadAll(){
 if(busy)return;
 busy=true;
 const btn=document.getElementById("refreshBtn");
 btn.disabled=true;
 setStatus("loading","正在读取行情K线...");
 document.getElementById("errorBox").style.display="none";
 try{
 await refreshTickerSnapshot();
 const results=await Promise.all(SYMBOLS.map(async symbol=>{
 try{
 return await loadOne(symbol);
 }catch(error){
 return {
 name:symbol.name,price:0,changePct:0,
 side:"NONE",type:"数据获取失败",score:0,
 reasons:error.message||"行情读取失败",
 trend4:"NEUTRAL",trend1:"NEUTRAL",trend15:"NEUTRAL",
 volOk:false,rsiValue:null,div:{bull:false,bear:false},
 entry:null,stop:null,tp1:null,tp2:null,tp3:null,rr:null,
 invalid:"等待行情恢复",longScore:0,shortScore:0,signalTime:Date.now()
 };
 }
 }));
 const newSignalSet = new Set();
 for(const r of results){
 if(r.side === "LONG" || r.side === "SHORT"){
 newSignalSet.add(r.symbolId + "_" + r.side);
 const added = addRecordIfNeed(r);
 if(added) playBeep();
 }
 }
 lastSignalKey = newSignalSet;
 document.getElementById("cards").innerHTML=results.map(renderCard).join("");
 if(results.filter(x=>x.price>0).length===0){
 throw new Error("所有币种行情获取失败");
 }
 const now=new Date();
 document.getElementById("lastUpdate").textContent=now.toLocaleTimeString("zh-CN",{hour12:false});
 setStatus("live","行情已就绪");
 const failed=results.filter(x=>x.price===0);
 if(failed.length){
 const box=document.getElementById("errorBox");
 box.style.display="block";
 box.textContent="部分币种读取失败："+failed.map(x=>x.name+"（"+x.reasons+"）").join("；");
 }
 }catch(error){
 setStatus("error","更新失败");
 const box=document.getElementById("errorBox");
 box.style.display="block";
 box.textContent=error.message;
 }finally{
 busy=false;
 btn.disabled=false;
 }
}
function startTimer(){
 if(timer)clearInterval(timer);
 timer=setInterval(loadAll,30000);
}
function toggleAuto(){
 autoRefresh=!autoRefresh;
 document.getElementById("autoText").textContent=autoRefresh?"开":"关";
 if(autoRefresh)startTimer();
 else if(timer){clearInterval(timer);timer=null;}
}
loadAll();
startTimer();
</script>
</body>
